
name: Deploy Hugo site with Blowfish Theme to Pages

on:
  push:
    branches:
      - main # 或者是你的預設分支名稱（例如 master）

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # 如果你是用 git submodule 引入主題，這行會自動抓取
          fetch-depth: 0

      # 關鍵步驟 1：設定 Go 語言環境（Blowfish 模組必備）
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' # 確保有 Go 環境來執行 hugo mod

      # 關鍵步驟 2：設定 Node.js 環境（Tailwind CSS 編譯必備）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # 關鍵步驟 3：安裝 Hugo（必須使用 extended 版本）
      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true # Blowfish 必須使用 extended 版本才能編譯 SCSS/Tailwind

      # 如果你在本機有調整 package.json，這行會自動安裝所需的套件
      - name: Install Node Dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          fi

      # 關鍵步驟 4：編譯網站（加上 --gc --minify 進行程式碼壓縮優化）
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}
          HUGO_ENV: production
        run: |
          hugo --gc --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4